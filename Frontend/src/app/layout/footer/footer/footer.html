<footer class="footer">
  <div class="footer__inner">

    <!-- Brand -->
    <div class="footer__brand">
      <a routerLink="/" class="footer__logo">SereneStay</a>
      <p class="footer__tagline">Curated boutique stays for the modern traveller.</p>
    </div>

    <!-- Legal Links -->
    <nav class="footer__nav" aria-label="Footer navigation">
      <a
        *ngFor="let link of footerLinks"
        [routerLink]="link.path"
        class="footer-link"
      >
        {{ link.label }}
      </a>
    </nav>

    <!-- Socials + Copyright -->
    <div class="footer__right">
      <div class="footer__socials">

        <!-- Instagram -->
        <a
          *ngFor="let social of socialLinks"
          [href]="social.href"
          class="social-btn"
          [attr.aria-label]="social.label"
          target="_blank"
          rel="noopener noreferrer"
        >
          <!-- Instagram -->
          <svg *ngIf="social.icon === 'instagram'"
            width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none"/>
          </svg>

          <!-- X / Twitter -->
          <svg *ngIf="social.icon === 'twitter'"
            width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>

          <!-- Globe -->
          <svg *ngIf="social.icon === 'globe'"
            width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
        </a>

      </div>

      <p class="footer__copy">
        &copy; {{ currentYear }} SereneStay Hospitality. All rights reserved.
      </p>
    </div>

  </div>
</footer>
